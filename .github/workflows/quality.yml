name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - modernize/2026-django-quality
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify runtime identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .python-version)"
          actual="$(python -c 'import platform; print(platform.python_version())')"
          echo "python=$actual"
          echo "sha=$GITHUB_SHA"
          test "$actual" = "$expected"

      - name: Install exact runtime graph
        run: python -m pip install --requirement requirements.txt

      - name: Repository hygiene contract
        run: python scripts/quality.py

      - name: B3 configuration contract
        run: python scripts/config_contract.py

      - name: Django system check
        working-directory: trabajocero
        run: python manage.py check

      - name: Migration drift check
        working-directory: trabajocero
        run: python manage.py makemigrations --check --dry-run

      - name: Rebuild local database from migrations
        working-directory: trabajocero
        run: |
          rm -f db.sqlite3
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Existing test suite
        working-directory: trabajocero
        run: python manage.py test -v 2

      - name: Dependency security audit
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --requirement requirements.txt

      - name: Verify tracked tree remains clean
        run: git diff --exit-code
